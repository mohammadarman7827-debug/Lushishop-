<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LushiShop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef1f5;position:relative;}

/* Main Header */
.header{
background:#fff;margin:10px;border-radius:0 0 20px 20px;
padding:20px;display:flex;justify-content:space-between;align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,.08)
}
.logo{font-size:28px;font-weight:700;color:#1d2740}
.icons{display:flex;gap:20px;font-size:28px;color:#555}
.cart{position:relative;cursor:pointer;}
.badge{position:absolute;top:-8px;right:-8px;background:red;color:#fff;
border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
h1{text-align:center;font-size:48px;color:#1d2740;margin:20px 0}

/* Grid & Cards */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.1);cursor:pointer;}
.card img{width:100%;height:240px;object-fit:cover}
.info{padding:15px;text-align:center}
.name{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:24px;font-weight:bold;margin:10px 0}
.btn{border:none;background:linear-gradient(90deg,#5b4cf0,#4f46e5);color:#fff;
padding:14px 30px;border-radius:40px;font-size:22px;width:90%;cursor:pointer;}
.pagination{text-align:center;padding:20px}
.pagination button{margin:4px;padding:10px 14px;border:none;border-radius:8px;cursor:pointer;}

/* 3-Line Side Navigation Menu */
.side-menu {
    position: fixed; top: 0; left: -260px; width: 250px; height: 100%;
    background: #fff; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.2);
    transition: 0.3s; padding: 20px; display: flex; flex-direction: column; gap: 15px;
}
.side-menu .close-btn { font-size: 24px; align-self: flex-end; cursor: pointer; }
.side-menu a { text-decoration: none; color: #1d2740; font-size: 18px; font-weight: bold; padding: 10px 0; border-bottom: 1px solid #eee; }

/* Overlay Screen Background */
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
.overlay.active { display: block; }

/* Product Detail Modal View */
.product-modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #fff; z-index: 1001; display: none; overflow-y: auto; padding-bottom: 30px;
}
.product-modal.active { display: block; }
.modal-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; background: #fff; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.modal-nav i { font-size: 22px; cursor: pointer; color: #333; }
.img-container { position: relative; width: 100%; height: 420px; background: #f0f0f0; }
.img-container img { width: 100%; height: 100%; object-fit: cover; }
.arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.8); border: none; border-radius: 50%;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.arrow-left { left: 15px; }
.arrow-right { right: 15px; }

.product-details-content { padding: 20px; max-width: 600px; margin: 0 auto; text-align: center; }
.product-details-content h2 { font-size: 24px; color: #1a202c; margin-bottom: 10px; font-weight: 700; line-height: 1.3; }
.p-price { font-size: 26px; font-weight: bold; color: #111; margin: 10px 0; }
.badge-tag {
    display: inline-flex; align-items: center; gap: 6px; background: #3b82f6; color: #fff;
    padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 15px;
}
.qty-selector { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0 20px; }
.qty-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ccc;
    background: #eef1f5; font-size: 18px; font-weight: bold; cursor: pointer;
}
.qty-number { font-size: 18px; font-weight: bold; }
.add-cart-btn {
    background: #4f46e5; color: #fff; border: none; width: 100%; padding: 16px;
    border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); margin-bottom: 25px;
}
.info-section { text-align: left; border-top: 1px solid #eee; padding-top: 15px; }
.info-section h3 { font-size: 18px; margin-bottom: 10px; color: #1d2740; }
.info-section ul { list-style: disc; margin-left: 20px; color: #444; font-size: 14px; margin-bottom: 15px; }
.info-section p { color: #555; font-size: 14px; line-height: 1.6; }

/* Video Style Side Cart Drawer */
.cart-drawer {
    position: fixed; top: 0; right: -360px; width: 340px; height: 100%;
    background: #fff; z-index: 1002; box-shadow: -4px 0 15px rgba(0,0,0,0.15);
    transition: 0.3s ease; display: flex; flex-direction: column; justify-content: space-between;
}
.cart-drawer.active { right: 0; }
.cart-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; border-bottom: 1px solid #eee; font-size: 20px; font-weight: bold; color: #1d2740;
}
.cart-drawer-header i { cursor: pointer; font-size: 20px; color: #666; }

.cart-items-container { padding: 15px; overflow-y: auto; flex-grow: 1; }
.empty-cart-msg { text-align: center; color: #777; margin-top: 40px; font-size: 16px; }

.cart-item {
    display: flex; gap: 12px; align-items: center; padding-bottom: 15px;
    margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; position: relative;
}
.cart-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }
.cart-item-details { flex-grow: 1; }
.cart-item-title { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cart-item-price { font-size: 15px; font-weight: bold; color: #1d2740; margin-bottom: 6px; }
.cart-item-qty { display: flex; align-items: center; gap: 8px; }
.cart-item-qty button { width: 24px; height: 24px; border: 1px solid #ddd; background: #f8f9fa; border-radius: 4px; font-weight: bold; cursor: pointer; }
.cart-item-qty span { font-size: 14px; font-weight: bold; }
.delete-item-btn { color: #ef4444; cursor: pointer; font-size: 16px; padding: 5px; }

.cart-drawer-footer { padding: 20px; border-top: 1px solid #eee; background: #fff; }
.coupon-box { display: flex; gap: 8px; margin-bottom: 15px; }
.coupon-box input { flex-grow: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
.coupon-box button { background: #1d2740; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

.cart-subtotal { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #1d2740; margin-bottom: 15px; }
.checkout-btn {
    width: 100%; background: #3b82f6; color: #fff; border: none; padding: 14px;
    border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
}
</style>
</head>
<body>

<!-- Side Navigation Drawer -->
<div class="side-menu" id="sideMenu">
    <div class="close-btn" onclick="closeMenu()"><i class="fas fa-times"></i></div>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Categories</a>
    <a href="#">Orders</a>
    <a href="#">Contact</a>
</div>

<!-- Screen Overlay -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- Header -->
<div class="header">
<div class="logo">LushiShop</div>
<div class="icons">
<div class="cart" onclick="openCartDrawer()"><i class="fas fa-cart-shopping"></i><div class="badge" id="count">0</div></div>
<i class="fas fa-bars" onclick="openMenu()" style="cursor:pointer;"></i>
</div>
</div>

<h1>Featured Products</h1>

<div class="products" id="products"></div>
<div class="pagination" id="pages"></div>

<!-- Product Detail Modal Page -->
<div class="product-modal" id="productModal">
    <div class="modal-nav">
        <i class="fas fa-arrow-left" onclick="closeModal()"></i>
        <i class="fas fa-globe"></i>
    </div>
    
    <div class="img-container">
        <button class="arrow-btn arrow-left"><i class="fas fa-chevron-left"></i></button>
        <img id="mImg" src="" alt="Product">
        <button class="arrow-btn arrow-right"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="product-details-content">
        <h2 id="mTitle">Product Name</h2>
        <div class="p-price" id="mPrice">₹0.00</div>
        
        <div class="badge-tag">
            <i class="fas fa-newspaper"></i> Stylish Wear
        </div>

        <div class="qty-selector">
            <button class="qty-btn" onclick="changeModalQty(-1)">-</button>
            <span class="qty-number" id="qtyVal">1</span>
            <button class="qty-btn" onclick="changeModalQty(1)">+</button>
        </div>

        <button class="add-cart-btn" onclick="addToCartFromModal()">Add to Cart</button>

        <div class="info-section">
            <h3>Product Information:</h3>
            <ul>
                <li>Category: <span id="mCategory">Women Wear</span></li>
                <li>Price: <span id="mListPrice">₹0.00</span></li>
            </ul>
            <p id="mDescription">
                Product details will appear here.
            </p>
        </div>
    </div>
</div>

<!-- Video Style Side Cart Drawer -->
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
        <span>Shopping Cart</span>
        <i class="fas fa-times" onclick="closeCartDrawer()"></i>
    </div>

    <div class="cart-items-container" id="cartItemsList">
        <div class="empty-cart-msg">Aapka Cart Khali Hai</div>
    </div>

    <div class="cart-drawer-footer">
        <div class="coupon-box">
            <input type="text" placeholder="Promo / Coupon Code">
            <button>Apply</button>
        </div>
        <div class="cart-subtotal">
            <span>Subtotal:</span>
            <span id="cartSubtotal">₹0.00</span>
        </div>
        <button class="checkout-btn" onclick="alert('Proceeding to Checkout!')">
            Proceed to Checkout <i class="fas fa-arrow-right"></i>
        </button>
    </div>
</div>

<script>
let page=1, per=6, currentQty=1;
let cartItems = []; 

// =========================================================
// SABHI PRODUCTS KA SEPARATE LISTING DATA YAHAN SE EDIT KAREIN
// =========================================================
const products = [
    {
        id: 1, 
        name: "Casual Short Kurti With Denim Jeans", 
        price: 199, 
        image: "images/p1.jpg",
        category: "womenwear2026",
        description: "Soft cotton short kurti with beautiful sleeve embroidery and stylish neckline. Perfect for casual wear."
    },
    {
        id: 2, 
        name: "Printed Cotton Floral Kurti Set", 
        price: 199, 
        image: "images/p2.jpg",
        category: "summerwear2026",
        description: "Lightweight and breathable printed floral kurti set designed for maximum comfort."
    },
    {
        id: 3, 
        name: "Designer Embroidered Kurti", 
        price: 199, 
        image: "images/p3.jpg",
        category: "ethnicwear",
        description: "Premium handcrafted designer embroidered kurti suitable for special occasions and daily wear."
    },
    {
        id: 4, 
        name: "embossed short kurti", 
        price: 139, 
        image: "images/p4.jpg",
        category: "westernoutfits",
        description: "Modern two-piece western casual outfit set combining a graphic printed shirt with classic denim jeans."
    },
    {
        id: 5, 
        name: "Premium Product 5", 
        price: 189, 
        image: "images/p5.jpg",
        category: "fashion",
        description: "High-quality outfit with modern fit and durable fabric quality."
    },
    {
        id: 6, 
        name: "Premium Product 6", 
        price: 199, 
        image: "images/p6.jpg",
        category: "fashion",
        description: "Comfortable and trendy product for daily stylish appearance."
    }
    // Aap niche aur products isi format me comma (,) lagakar add kar sakte hain:
    /*
    ,{
        id: 7, 
        name: "Apna Product Title", 
        price: 250, 
        image: "images/p7.jpg",
        category: "category_name",
        description: "Apni product details yahan likhein."
    }
    */
];

let activeSelectedProduct = null;

function render(){
let start=(page-1)*per;
let list=products.slice(start,start+per);
document.getElementById('products').innerHTML=list.map(p=>`
<div class='card' onclick='viewProduct(${p.id})'>
<img src='${p.image}' onerror="this.src='https://via.placeholder.com/400x400?text=P${p.id}'">
<div class='info'>
<div class='name'>${p.name}</div>
<div class='price'>₹${p.price}</div>
<button class='btn' onclick='event.stopPropagation(); viewProduct(${p.id})'>View</button>
</div>
</div>`).join('');

renderPagination();
}

function renderPagination(){
    let total=Math.ceil(products.length/per), h='';
    for(let i=1;i<=total;i++){
        h+=`<button onclick="page=${i};render()">${i}</button>`;
    }
    document.getElementById('pages').innerHTML=h;
}

function openMenu(){
    document.getElementById("sideMenu").style.left = "0";
    document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
    document.getElementById("sideMenu").style.left = "-260px";
    document.getElementById("overlay").classList.remove("active");
}

function viewProduct(id){
    let item = products.find(p => p.id === id);
    if(item){
        activeSelectedProduct = item;
        document.getElementById("mImg").src = item.image;
        document.getElementById("mImg").onerror = function(){
            this.src = 'https://via.placeholder.com/400x400?text=P' + item.id;
        };
        document.getElementById("mTitle").innerText = item.name;
        document.getElementById("mPrice").innerText = "₹" + item.price + ".00";
        document.getElementById("mListPrice").innerText = "₹" + item.price + ".00";
        document.getElementById("mCategory").innerText = item.category || 'General';
        document.getElementById("mDescription").innerText = item.description || 'Quality product.';
        
        currentQty = 1;
        document.getElementById("qtyVal").innerText = currentQty;
        
        document.getElementById("productModal").classList.add("active");
    }
}

function closeModal(){
    document.getElementById("productModal").classList.remove("active");
}

function changeModalQty(amt){
    if(currentQty + amt >= 1){
        currentQty += amt;
        document.getElementById("qtyVal").innerText = currentQty;
    }
}

/* Cart Drawer Functions */
function addToCartFromModal(){
    if(!activeSelectedProduct) return;

    let existingItem = cartItems.find(item => item.id === activeSelectedProduct.id);
    if(existingItem){
        existingItem.qty += currentQty;
    } else {
        cartItems.push({
            id: activeSelectedProduct.id,
            name: activeSelectedProduct.name,
            price: activeSelectedProduct.price,
            image: activeSelectedProduct.image,
            qty: currentQty
        });
    }

    closeModal();
    updateCartUI();
    openCartDrawer();
}

function updateCartUI(){
    let totalItemsCount = 0;
    let subtotalPrice = 0;

    let cartListHTML = '';

    if(cartItems.length === 0){
        cartListHTML = '<div class="empty-cart-msg">Aapka Cart Khali Hai</div>';
    } else {
        cartItems.forEach(item => {
            totalItemsCount += item.qty;
            subtotalPrice += (item.price * item.qty);

            cartListHTML += `
                <div class="cart-item">
                    <img src="${item.image}" onerror="this.src='https://via.placeholder.com/100?text=P${item.id}'">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">₹${item.price}.00</div>
                        <div class="cart-item-qty">
                            <button onclick="updateQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                    <i class="fas fa-trash-can delete-item-btn" onclick="removeItem(${item.id})"></i>
                </div>
            `;
        });
    }

    document.getElementById("count").innerText = totalItemsCount;
    document.getElementById("cartItemsList").innerHTML = cartListHTML;
    document.getElementById("cartSubtotal").innerText = "₹" + subtotalPrice.toFixed(2);
}

function updateQty(id, amt){
    let item = cartItems.find(i => i.id === id);
    if(item){
        item.qty += amt;
        if(item.qty <= 0){
            removeItem(id);
        } else {
            updateCartUI();
        }
    }
}

function removeItem(id){
    cartItems = cartItems.filter(i => i.id !== id);
    updateCartUI();
}

function openCartDrawer(){
    document.getElementById("cartDrawer").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeCartDrawer(){
    document.getElementById("cartDrawer").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function closeAll(){
    closeMenu();
    closeModal();
    closeCartDrawer();
}

render();
</script>
</body>
</html>
